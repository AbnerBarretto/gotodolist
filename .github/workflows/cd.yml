name: CD

on:
  workflow_run:
    workflows: ["Publish Docker Images and Release"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via Portainer Webhook
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Chamar webhook do Portainer
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "Erro: secret PORTAINER_WEBHOOK_URL nao definido"
            exit 1
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST -k --max-time 60 "$WEBHOOK")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 204 ] && [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Erro: Webhook retornou $HTTP_STATUS (esperado: 204)"
            exit 1
          fi
          echo "Sucesso: Webhook chamado - Portainer esta atualizando a stack"